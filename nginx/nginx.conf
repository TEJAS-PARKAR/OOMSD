events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate Limiting: 10 requests per second per IP (Burst up to 20 requests)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;

    # Load Balancer Upstream Cluster (Round-Robin across 2 API container replicas)
    upstream api_cluster {
        # Round Robin algorithm (default) with fail_timeout
        server api-replica-1:5000 max_fails=3 fail_timeout=10s;
        server api-replica-2:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip compression for static performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # 1. API Gateway & Load Balancing Route
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;

            proxy_pass http://api_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass along upstream replica identification headers
            proxy_pass_header X-Handled-By;
            proxy_pass_header X-Cluster-Node;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 2. Swagger Docs Route
        location /docs {
            proxy_pass http://api_cluster/docs;
            proxy_set_header Host $host;
        }

        # 3. Frontend Single-Page Application (Vite Dev / Prod Server)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
