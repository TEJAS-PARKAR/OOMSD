services:
  # 1. API Gateway & Reverse Proxy / Load Balancer
  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: railway-gateway
    ports:
      - "80:80"
    depends_on:
      - api-replica-1
      - api-replica-2
      - frontend
    restart: unless-stopped
    networks:
      - railway-net

  # 2. React Single-Page Application Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: railway-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://gateway
    restart: unless-stopped
    networks:
      - railway-net

  # 3. Backend API Container Replica 1
  api-replica-1:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: railway-api-1
    environment:
      - PORT=5000
      - REPLICA_ID=API-Replica-1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=railway_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DATABASE_URL=postgres://postgres:postgres@db:5432/railway_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=irctc_oomsd_secret_key_2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - railway-net

  # 4. Backend API Container Replica 2
  api-replica-2:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: railway-api-2
    environment:
      - PORT=5000
      - REPLICA_ID=API-Replica-2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=railway_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DATABASE_URL=postgres://postgres:postgres@db:5432/railway_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=irctc_oomsd_secret_key_2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - railway-net

  # 5. Database Service (PostgreSQL 16 with 3NF Schema)
  db:
    image: postgres:16-alpine
    container_name: railway-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=railway_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railway_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - railway-net

  # 6. Cache Layer (Redis with Cache-Aside Strategy)
  redis:
    image: redis:7-alpine
    container_name: railway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - railway-net

volumes:
  postgres_data:
  redis_data:

networks:
  railway-net:
    driver: bridge
